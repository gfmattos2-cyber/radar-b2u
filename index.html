<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radar B2U · Prospecção Comercial</title>

<!-- Tipografia Oficial B2U (Manual da Marca): Jost (substituto oficial da Futura), Montserrat e Barlow Condensed -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Jost:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  /* =========================================================
     DESIGN SYSTEM B2U ENERGIA · MANUAL DA MARCA v1.0 (2026)
     ========================================================= */
  :root {
    /* Cores Primárias e Secundárias */
    --b2u-orange: #ff5e0f;       /* Laranja Solar (Ação, CTAs, Destaque) */
    --b2u-orange-hover: #e84e08; /* Laranja 600 */
    --b2u-orange-press: #c03f08; /* Laranja 700 */
    --b2u-orange-50: #fff4ec;    /* Fundo suave laranja */
    --b2u-orange-100: #ffe4d1;
    --b2u-amber: #ffa121;        /* Âmbar secundário */
    --b2u-amber-50: #fff8ec;
    
    /* Neutros Oficiais (Nunca usar preto puro) */
    --b2u-ink: #363636;          /* Carvão principal para texto */
    --b2u-ink-soft: #636363;     /* Carvão médio para apoio */
    --b2u-mist: #f6f6f6;         /* Névoa: fundo do produto */
    --b2u-card: #ffffff;         /* Superfície dos cards */
    --b2u-line: #ebebeb;         /* Linhas sutis */
    --b2u-line-strong: #dedede;
    
    /* Cores Funcionais do Manual */
    --b2u-success: #1e9e6a;
    --b2u-warning: #ffa121;
    --b2u-error: #d83a2b;
    --b2u-info: #2d7ff0;

    /* Gradiente Assinatura (Exatamente 135deg, Laranja Solar ao Âmbar) */
    --b2u-gradient: linear-gradient(135deg, #ff5e0f 0%, #ffa121 100%);
    
    /* Elevações e Raios do Manual */
    --radius-btn: 12px;
    --radius-card: 20px;
    --radius-pill: 999px;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.03);
    --shadow-glow: 0 4px 18px rgba(255, 94, 15, 0.22);
    
    /* Safe Area Mobile */
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; padding: 0;
    background-color: var(--b2u-mist);
    color: var(--b2u-ink);
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding-bottom: calc(88px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }

  /* Títulos em Jost (Substituto oficial da Futura) */
  h1, h2, h3 {
    font-family: 'Jost', sans-serif;
    letter-spacing: -0.015em;
    color: var(--b2u-ink);
    margin: 0;
    font-weight: 700;
  }

  /* Eyebrows em Barlow Condensed Caixa Alta */
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    line-height: 1.2;
  }

  /* Ícones SVG Lucide (traço de 1.75px a 2px arredondado) */
  .icon-svg {
    width: 16px; height: 16px;
    stroke: currentColor;
    stroke-width: 1.85;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    display: inline-block;
    vertical-align: middle;
    flex-shrink: 0;
  }

  /* ---------- CABEÇALHO B2U ---------- */
  header.app-header {
    background: var(--b2u-gradient);
    color: #ffffff;
    padding: 14px 18px 12px;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 4px 20px rgba(255, 94, 15, 0.25);
  }

  .brand-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }

  .brand-container {
    display: flex; align-items: center; gap: 10px;
  }

  /* Símbolo Squircle B2U com lettermark b2u */
  .brand-squircle {
    width: 34px; height: 34px;
    background: rgba(255, 255, 255, 0.22);
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    border-radius: 10px; /* ~28% do lado */
    display: flex; align-items: center; justify-content: center;
    font-family: 'Jost', sans-serif;
    font-weight: 800; font-size: 15px; color: #ffffff;
    letter-spacing: -0.05em; flex-shrink: 0;
  }

  .brand-text-wrap { display: flex; flex-direction: column; }
  .brand-title {
    font-family: 'Jost', sans-serif;
    font-size: 17px; font-weight: 700; line-height: 1; color: #ffffff;
  }
  .brand-descritor {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em;
    color: rgba(255, 255, 255, 0.9); margin-top: 2px;
    text-transform: uppercase;
  }

  .header-actions { display: flex; align-items: center; gap: 6px; }

  .btn-hdr-action {
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #ffffff;
    border-radius: var(--radius-btn);
    padding: 7px 11px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
    transition: background 140ms ease-out, transform 140ms ease-out;
  }
  .btn-hdr-action:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.28); }

  /* Seletor de Cidades no Cabeçalho */
  .city-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0, 0, 0, 0.16);
    border-radius: 12px; padding: 6px 12px; margin-top: 10px; gap: 8px;
  }
  .city-label-group {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: #ffffff;
  }
  .city-dropdown {
    background: #ffffff; color: var(--b2u-orange);
    border: none; border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12.5px; font-weight: 700;
    padding: 5px 10px; outline: none; cursor: pointer;
  }

  /* Indicador de Status da Nuvem */
  .cloud-status {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Montserrat', sans-serif;
    font-size: 10.5px; font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    margin-top: 6px;
  }
  .cloud-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2ecc71; flex-shrink: 0;
  }
  .cloud-dot.syncing { background: #f1c40f; animation: pulse 1s infinite; }
  .cloud-dot.offline { background: #e74c3c; }

  @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

  /* ---------- NAVEGAÇÃO ENTRE DIAS E VISÕES ---------- */
  .day-chips-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 10px 18px 0; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .day-chips-bar::-webkit-scrollbar { display: none; }
  .day-chip {
    flex-shrink: 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px; border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #ffffff; cursor: pointer;
    transition: background 140ms ease-out, color 140ms ease-out;
  }
  .day-chip.active {
    background: #ffffff; color: var(--b2u-orange);
    border-color: #ffffff;
  }

  .view-tabs-bar {
    display: flex; gap: 6px; padding: 10px 18px 12px;
  }
  .view-tab {
    flex: 1; text-align: center; padding: 8px 0;
    border-radius: var(--radius-btn);
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600; font-size: 12.5px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 140ms ease-out, color 140ms ease-out;
  }
  .view-tab.active { background: #ffffff; color: var(--b2u-orange); font-weight: 700; }

  /* ---------- CONTEÚDO PRINCIPAL ---------- */
  main.main-content {
    max-width: 680px; margin: 0 auto; padding: 16px 16px 8px;
  }

  .search-wrapper { margin-bottom: 12px; }
  .search-input {
    width: 100%; background: #ffffff;
    border: 1px solid var(--b2u-line);
    border-radius: var(--radius-btn);
    padding: 10px 14px; font-family: 'Montserrat', sans-serif;
    font-size: 13.5px; color: var(--b2u-ink);
    box-shadow: var(--shadow-sm); outline: none;
    transition: border-color 140ms ease-out, box-shadow 140ms ease-out;
  }
  .search-input:focus {
    border-color: var(--b2u-orange);
    box-shadow: 0 0 0 4px var(--b2u-orange-50);
  }

  .meta-info-row {
    display: flex; justify-content: space-between; align-items: center;
    margin: 6px 4px 12px;
  }
  .meta-title {
    font-family: 'Jost', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--b2u-ink);
  }
  .progress-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
    background: #ffffff; border: 1px solid var(--b2u-line);
    padding: 4px 12px; border-radius: var(--radius-pill);
    box-shadow: var(--shadow-sm); color: var(--b2u-ink-soft);
  }
  .progress-tag b { color: var(--b2u-orange); }

  /* ---------- CARDS DE ESTABELECIMENTO (Manual: Raio 20px, Sombra suave) ---------- */
  .establishment-card {
    background: var(--b2u-card);
    border: 1px solid var(--b2u-line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
    padding: 16px; margin-bottom: 12px;
    position: relative;
    transition: box-shadow 220ms ease-out, transform 220ms ease-out;
  }
  .establishment-card:hover {
    box-shadow: var(--shadow-md);
  }
  .establishment-card.visited {
    background: #fdfdfd;
    border-color: var(--b2u-line);
    opacity: 0.94;
  }

  .card-header-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .stop-badge {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--b2u-gradient);
    color: #ffffff;
    font-family: 'Jost', sans-serif;
    font-weight: 700; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .card-headings { flex: 1; min-width: 0; }
  .card-business-name {
    font-family: 'Jost', sans-serif;
    font-size: 15.5px; font-weight: 700; line-height: 1.25;
    color: var(--b2u-ink);
  }
  .card-segment-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--b2u-orange);
    margin-top: 3px;
  }

  .card-address-text {
    font-size: 12.5px; color: var(--b2u-ink-soft);
    margin-top: 8px; line-height: 1.4;
  }
  .badge-distance {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
    background: var(--b2u-orange-50); color: var(--b2u-orange-press);
    padding: 2px 7px; border-radius: 4px; margin-left: 4px;
  }

  /* Tag de Concorrência */
  .competitor-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: #e0f7fa; color: #006064;
    padding: 4px 10px; border-radius: var(--radius-pill);
    font-size: 11.5px; font-weight: 600; margin-top: 8px;
  }

  /* Ações Rápidas (Sem emojis, botões com altura 36px e raio 12px) */
  .quick-actions-bar {
    display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap;
  }
  .btn-action {
    height: 36px; padding: 0 12px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--b2u-line-strong);
    background: #ffffff; color: var(--b2u-ink);
    font-family: 'Montserrat', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 140ms ease-out;
  }
  .btn-action:active { transform: scale(0.98); }
  .btn-action.btn-maps {
    background: var(--b2u-orange-50);
    border-color: var(--b2u-orange-100);
    color: var(--b2u-orange);
  }
  .btn-action.btn-maps:hover {
    background: var(--b2u-orange); color: #ffffff;
  }

  /* Bloco de Status e Observações */
  .card-footer-block {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed var(--b2u-line);
    display: flex; flex-direction: column; gap: 8px;
  }
  .status-select-container { display: flex; align-items: center; gap: 8px; }
  .status-dropdown {
    flex: 1; height: 38px; padding: 0 12px;
    border-radius: var(--radius-btn);
    font-family: 'Montserrat', sans-serif;
    font-weight: 600; font-size: 12.5px;
    border: none; cursor: pointer; color: #ffffff; outline: none;
  }
  .status-date-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 600; color: var(--b2u-ink-soft);
  }

  .notes-preview-box {
    font-size: 12.5px; background: var(--b2u-mist);
    border: 1px solid var(--b2u-line);
    border-radius: 10px; padding: 8px 12px;
    color: var(--b2u-ink); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .notes-preview-box.empty { color: #8c8c8c; font-style: italic; }

  /* ---------- MAPA LEAFLET ---------- */
  #map-view {
    display: none; height: calc(100vh - 250px); width: 100%;
    border-radius: var(--radius-card);
    border: 1px solid var(--b2u-line);
    box-shadow: var(--shadow-sm);
  }

  /* ---------- MODAIS / BOTTOM SHEET ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(54, 54, 54, 0.6);
    z-index: 100; display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-card {
    background: #ffffff; width: 100%; max-width: 600px;
    border-radius: 24px 24px 0 0; max-height: 90vh;
    overflow-y: auto; padding: 22px 20px 28px;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.12);
    animation: modalSlideUp 220ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes modalSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-top-bar {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .modal-heading {
    font-family: 'Jost', sans-serif;
    font-size: 17px; font-weight: 700; color: var(--b2u-ink);
  }
  .btn-modal-close {
    background: var(--b2u-mist); border: none; border-radius: 50%;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--b2u-ink); font-weight: 700;
  }

  .form-field-group { margin-bottom: 12px; }
  .form-field-label {
    font-size: 12px; font-weight: 600; color: var(--b2u-ink); margin-bottom: 5px; display: block;
  }
  .form-text-input, .form-select-input, .form-textarea-input {
    width: 100%; padding: 10px 14px;
    border: 1px solid var(--b2u-line-strong);
    border-radius: var(--radius-btn);
    font-family: 'Montserrat', sans-serif; font-size: 13.5px;
    color: var(--b2u-ink); outline: none;
    transition: border-color 140ms ease-out, box-shadow 140ms ease-out;
  }
  .form-text-input:focus, .form-select-input:focus, .form-textarea-input:focus {
    border-color: var(--b2u-orange);
    box-shadow: 0 0 0 4px var(--b2u-orange-50);
  }
  .form-grid-2 { display: flex; gap: 10px; }

  /* Botão Primário B2U (Manual: Altura 44px, Montserrat 700, Sentence case) */
  .btn-primary-b2u {
    height: 44px; width: 100%;
    background: var(--b2u-orange);
    color: #ffffff; border: none;
    border-radius: var(--radius-btn);
    font-family: 'Montserrat', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 14px; box-shadow: var(--shadow-glow);
    transition: background 220ms ease-out, transform 220ms ease-out;
  }
  .btn-primary-b2u:hover { background: var(--b2u-orange-hover); }
  .btn-primary-b2u:active { transform: scale(0.98); background: var(--b2u-orange-press); }

  /* Toast Notificação */
  .toast-notification {
    position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
    background: var(--b2u-ink); color: #ffffff;
    padding: 9px 18px; border-radius: var(--radius-pill);
    font-family: 'Montserrat', sans-serif; font-size: 12.5px; font-weight: 600;
    z-index: 200; display: none; box-shadow: var(--shadow-md);
  }

  /* Botão Flutuante Adicionar Ponto (FAB) */
  .floating-add-btn {
    position: fixed; right: 20px; bottom: calc(24px + var(--safe-bottom));
    background: var(--b2u-gradient); color: #ffffff;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    box-shadow: var(--shadow-glow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 45;
    transition: transform 220ms ease-out;
  }
  .floating-add-btn:active { transform: scale(0.95); }
</style>
</head>

<body>

<!-- CABEÇALHO OFICIAL B2U -->
<header class="app-header">
  <div class="brand-bar">
    <div class="brand-container">
      <div class="brand-squircle">b2u</div>
      <div class="brand-text-wrap">
        <span class="brand-title">B2U Energia</span>
        <span class="brand-descritor">Radar de Prospecção</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-hdr-action" onclick="fetchDataFromSheet()" title="Recarregar dados da nuvem">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        Atualizar
      </button>
      <button class="btn-hdr-action" onclick="openConfigModal()" title="Configurações">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Ajustes
      </button>
    </div>
  </div>

  <!-- SELETOR DE CIDADES -->
  <div class="city-bar">
    <div class="city-label-group">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M19 21v-4"/><path d="M19 17a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4"/><path d="M9 10a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v5H9z"/></svg>
      Cidade:
    </div>
    <select class="city-dropdown" id="citySelect" onchange="changeCity(this.value)">
      <option value="Pedro Leopoldo">Pedro Leopoldo</option>
      <option value="Matozinhos">Matozinhos</option>
      <option value="Lagoa Santa">Lagoa Santa</option>
      <option value="Vespasiano">Vespasiano</option>
      <option value="Juatuba">Juatuba</option>
      <option value="Mateus Leme">Mateus Leme</option>
      <option value="Itaúna">Itaúna</option>
      <option value="Congonhas">Congonhas</option>
      <option value="Conselheiro Lafaiete">Conselheiro Lafaiete</option>
      <option value="Ouro Branco">Ouro Branco</option>
    </select>
  </div>

  <div class="cloud-status" id="cloudStatus">
    <div class="cloud-dot" id="cloudDot"></div>
    <span id="cloudText">Nuvem ativa</span>
  </div>

<script>
/* =========================================================
   PALETA E STATUS CONFORME MANUAL DA MARCA B2U
   ========================================================= */
const STATUS_COLORS = {
  "Não visitado": "#636363",
  "Sem decisor no local": "#ffa121",
  "Não elegível": "#363636",
  "Recusou": "#d83a2b",
  "Retornar depois": "#ff5e0f",
  "Interessado - aguardando fatura": "#2d7ff0",
  "Proposta apresentada": "#8e44ad",
  "Em negociação": "#ff5e0f",
  "Fechado": "#1e9e6a",
  "Termo assinado": "#13724b",
  "Já com desconto": "#00838f"
};
const STATUS_LIST = Object.keys(STATUS_COLORS);

const DEFAULT_CITIES = [
  "Pedro Leopoldo", "Matozinhos", "Lagoa Santa", "Vespasiano",
  "Juatuba", "Mateus Leme", "Itaúna", "Congonhas", "Conselheiro Lafaiete", "Ouro Branco"
];

const DEFAULT_STOPS = [
  {id:"pl-01", day:1, cidade:"Pedro Leopoldo", name:"Rancho Festas e Eventos", segment:"Casa de eventos", address:"R. Nossa Sra. do Rosário, 1599 - Espraiado", bairro:"fora do circuito, ~7,2km", far:true, phone:"+55 31 99089-6855", lat:-19.6856888, lng:-44.0520705},
  {id:"pl-02", day:1, cidade:"Pedro Leopoldo", name:"Recanto Tapera", segment:"Pousada", address:"R. São Geraldo, 158 - Tapera", bairro:"fora do circuito, ~5,6km", far:true, phone:"+55 31 99665-2477", lat:-19.6720171, lng:-44.045876},
  {id:"pl-03", day:1, cidade:"Pedro Leopoldo", name:"COLÉGIO M2", segment:"Escola", address:"R. Teófilo Calazans de Barros, 100 - Santo Antonio", bairro:"fora do circuito, ~3,3km", far:true, phone:"+55 31 3662-3901", lat:-19.6485871, lng:-44.0532064},
  {id:"pl-04", day:1, cidade:"Pedro Leopoldo", name:"Celeiro de Hóspedes", segment:"Pousada", address:"R. Comendador Antônio Alves, 2565 - Santo Antônio", bairro:"Santo Antônio", phone:"+55 31 99770-1025", lat:-19.6349319, lng:-44.0305764},
  {id:"pl-05", day:1, cidade:"Pedro Leopoldo", name:"Big Pão", segment:"Padaria", address:"R. Comendador Antônio Alves, 1960 - São José", bairro:"São José", phone:"+55 31 3661-2090", lat:-19.6303234, lng:-44.0345307},
  {id:"pl-06", day:1, cidade:"Pedro Leopoldo", name:"Revisauto Centro Automotivo", segment:"Oficina mecânica", address:"R. Comendador Antônio Alves, 1415 - Centro", bairro:"Centro", phone:"+55 31 98982-0536", lat:-19.6263561, lng:-44.0373868},
  {id:"pl-07", day:1, cidade:"Pedro Leopoldo", name:"Marina Coisas da Roça", segment:"Padaria", address:"R. Comendador Antônio Alves, 1213 - Centro", bairro:"Centro", phone:"+55 31 3661-3141", lat:-19.6248589, lng:-44.038407},
  {id:"pl-08", day:1, cidade:"Pedro Leopoldo", name:"Zé Wilson Restaurante", segment:"Restaurante", address:"R. Comendador Antônio Alves, 1009 - Centro", bairro:"Centro", phone:"+55 31 3661-1223", lat:-19.6232364, lng:-44.0398478},
  {id:"pl-09", day:1, cidade:"Pedro Leopoldo", name:"Academia PULSAR", segment:"Academia", address:"R. Comendador Antônio Alves, 645 - Centro", bairro:"Centro", phone:"+55 31 3660-4021", lat:-19.6207676, lng:-44.0416635},
  {id:"pl-10", day:1, cidade:"Pedro Leopoldo", name:"Padaria Jaques", segment:"Padaria", address:"R. Comendador Antônio Alves, 462 - Centro", bairro:"Centro", phone:"+55 31 3661-1738", lat:-19.6196186, lng:-44.0429894}
];

// URL do Google Apps Script configurada pelo usuário
const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbxxvqn0H_hYAkwIzge6WvInNbDIGHn2fYhkC3mcLVt48BVnmjX4MSdknKNuauH1JysVfw/exec";

const LS_STOPS_KEY = "radar_b2u_stops_multi_v1";
const LS_STATE_KEY = "radar_b2u_state_multi_v1";
const LS_CONFIG_KEY = "radar_b2u_config_multi_v1";
const LS_SELECTED_CITY = "radar_b2u_current_city_v1";

let STOPS = loadStops();
let STATE = loadState();
let CONFIG = loadConfig();
let currentCity = localStorage.getItem(LS_SELECTED_CITY) || "Pedro Leopoldo";

let currentDay = 1;
let currentView = "rota";
let currentEditingId = null;
let currentSearchTerm = "";
let map = null;
let mapLayer = null;

function loadStops() {
  try {
    const raw = localStorage.getItem(LS_STOPS_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_STOPS;
  } catch(e) { return DEFAULT_STOPS; }
}
function saveStops(stops) {
  STOPS = stops;
  localStorage.setItem(LS_STOPS_KEY, JSON.stringify(stops));
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS_STATE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveState(state) {
  STATE = state;
  localStorage.setItem(LS_STATE_KEY, JSON.stringify(state));
}
function loadConfig() {
  try {
    const raw = localStorage.getItem(LS_CONFIG_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return {
      apiUrl: parsed.apiUrl || DEFAULT_API_URL,
      sellerName: parsed.sellerName || "Gabriel Mattos"
    };
  } catch(e) { return { apiUrl: DEFAULT_API_URL, sellerName: "Gabriel Mattos" }; }
}

function getStopData(id) {
  const base = STOPS.find(s => s.id === id) || {};
  const dyn = STATE[id] || {};
  return Object.assign({
    status: "Não visitado",
    date: "",
    note: "",
    contact: "",
    phone: base.phone || "",
    email: "",
    consumo: "",
    padrao: "",
    concorrente: "",
    desconto_concorrente: "",
    fidelidade: "",
    cidade: base.cidade || currentCity,
    responsible: CONFIG.sellerName || "Gabriel Mattos"
  }, base, dyn);
}

function initApp() {
  populateCityDropdown();
  renderDayBar();
  renderCards();
  updateSyncStatusHeader();
}

function populateCityDropdown() {
  const sel = document.getElementById("citySelect");
  const availableCities = Array.from(new Set([...DEFAULT_CITIES, ...STOPS.map(s => s.cidade).filter(Boolean)]));
  sel.innerHTML = availableCities.map(c => `<option value="${c}" ${c === currentCity ? 'selected' : ''}>${c}</option>`).join("");
}

function changeCity(city) {
  currentCity = city;
  localStorage.setItem(LS_SELECTED_CITY, city);
  currentDay = 1;
  renderDayBar();
  renderCards();
  if (currentView === "mapa") renderMap();
  showToast(`Cidade: ${city}`);
}

function getCityStops() {
  return STOPS.filter(s => (s.cidade || "Pedro Leopoldo").toLowerCase() === currentCity.toLowerCase());
}

function getDaysList() {
  const cityStops = getCityStops();
  const days = Array.from(new Set(cityStops.map(s => s.day || 1))).sort((a,b) => a - b);
  return days.length > 0 ? days : [1];
}

function renderDayBar() {
  const dayBar = document.getElementById("dayBar");
  const days = getDaysList();
  if (!days.includes(currentDay)) currentDay = days[0];

  dayBar.innerHTML = days.map(d => `
    <div class="day-chip ${d === currentDay ? 'active' : ''}" onclick="selectDay(${d})">Dia ${d}</div>
  `).join("");
}

function selectDay(d) {
  currentDay = d;
  renderDayBar();
  renderCards();
  if (currentView === "mapa") renderMap();
}

function switchView(view) {
  currentView = view;
  document.getElementById("tabRota").className = `view-tab ${view === 'rota' ? 'active' : ''}`;
  document.getElementById("tabMapa").className = `view-tab ${view === 'mapa' ? 'active' : ''}`;

  if (view === "rota") {
    document.getElementById("cardsWrap").style.display = "block";
    document.getElementById("searchWrap").style.display = "block";
    document.getElementById("dayMetaWrap").style.display = "flex";
    document.getElementById("map-view").style.display = "none";
  } else {
    document.getElementById("cardsWrap").style.display = "none";
    document.getElementById("searchWrap").style.display = "none";
    document.getElementById("dayMetaWrap").style.display = "none";
    document.getElementById("map-view").style.display = "block";
    setTimeout(renderMap, 100);
  }
}

function handleSearch() {
  currentSearchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
  renderCards();
}

function renderCards() {
  const wrap = document.getElementById("cardsWrap");
  let dayStops = getCityStops().filter(s => (s.day || 1) === currentDay);

  if (currentSearchTerm) {
    dayStops = getCityStops().filter(s => 
      s.name.toLowerCase().includes(currentSearchTerm) ||
      (s.address && s.address.toLowerCase().includes(currentSearchTerm)) ||
      (s.segment && s.segment.toLowerCase().includes(currentSearchTerm)) ||
      (s.bairro && s.bairro.toLowerCase().includes(currentSearchTerm))
    );
  }

  const total = dayStops.length;
  const visited = dayStops.filter(s => {
    const st = (STATE[s.id] && STATE[s.id].status) || "Não visitado";
    return st !== "Não visitado";
  }).length;
  
  document.getElementById("dayLabel").innerText = currentSearchTerm ? `Busca em ${currentCity}` : `${currentCity} · Dia ${currentDay}`;
  document.getElementById("dayProgress").innerHTML = `Visitados: <b>${visited}/${total}</b>`;

  if (dayStops.length === 0) {
    wrap.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--b2u-ink-soft);">
      Nenhum estabelecimento cadastrado para <b>${currentCity} (Dia ${currentDay})</b>.<br>
      <small style="margin-top:6px; display:inline-block;">Toque no botão <b>+</b> para cadastrar um estabelecimento ou importe novos dados em Ajustes.</small>
    </div>`;
    return;
  }

  wrap.innerHTML = dayStops.map((stop, index) => {
    const data = getStopData(stop.id);
    const statusColor = STATUS_COLORS[data.status] || "#636363";
    const isDone = data.status !== "Não visitado";
    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.name + ' ' + stop.address + ' ' + currentCity)}`;
    const wazeUrl = stop.lat && stop.lng ? `https://waze.com/ul?ll=${stop.lat},${stop.lng}&navigate=yes` : `https://waze.com/ul?q=${encodeURIComponent(stop.address + ' ' + currentCity)}`;
    const rawPhone = (data.phone || "").replace(/\D/g, "");
    const waUrl = rawPhone ? `https://wa.me/55${rawPhone}` : null;

    return `
      <div class="establishment-card ${isDone ? 'visited' : ''}" id="card-${stop.id}">
        <div class="card-header-row">
          <div class="stop-badge">${index + 1}</div>
          <div class="card-headings">
            <div class="card-business-name">${stop.name}</div>
            <div class="card-segment-tag">${stop.segment || 'Comércio'}</div>
          </div>
        </div>

        <div class="card-address-text">
          ${stop.address}
          ${stop.far ? `<span class="badge-distance">${stop.bairro}</span>` : (stop.bairro ? ` · <b>${stop.bairro}</b>` : '')}
        </div>

        ${data.concorrente ? `
          <div class="competitor-pill">
            <svg class="icon-svg" style="width:13px;height:13px;" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Concorrente: <b>${data.concorrente}</b> ${data.desconto_concorrente ? `(${data.desconto_concorrente})` : ''}
          </div>
        ` : ''}

        <!-- Ações Rápidas -->
        <div class="quick-actions-bar">
          <a href="${mapsUrl}" target="_blank" class="btn-action btn-maps">
            <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
            Maps
          </a>
          <a href="${wazeUrl}" target="_blank" class="btn-action">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>
            Waze
          </a>
          ${data.phone ? `
            <a href="tel:${data.phone}" class="btn-action">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              Ligar
            </a>
          ` : ''}
          ${waUrl ? `
            <a href="${waUrl}" target="_blank" class="btn-action">
              <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              WhatsApp
            </a>
          ` : ''}
          <button class="btn-action" onclick="openQualifyModal('${stop.id}')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Qualificar
          </button>
        </div>

        <!-- Seletor de Status e Nota -->
        <div class="card-footer-block">
          <div class="status-select-container">
            <select class="status-dropdown" style="background:${statusColor};" onchange="updateStopStatus('${stop.id}', this.value)">
              ${STATUS_LIST.map(st => `<option value="${st}" ${st === data.status ? 'selected' : ''}>${st}</option>`).join("")}
            </select>
            ${data.date ? `<span class="status-date-label">${data.date.split(' ')[0]}</span>` : ''}
          </div>

          <div class="notes-preview-box ${data.note ? '' : 'empty'}" onclick="openQualifyModal('${stop.id}')">
            <svg class="icon-svg" style="width:14px;height:14px;color:var(--b2u-ink-soft);" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>${data.note ? data.note : 'Adicionar notas da visita...'}</span>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

/* =========================================================
   SINCRONIZAÇÃO EM NUVEM
   ========================================================= */
async function syncItemToSheets(itemData) {
  const cloudDot = document.getElementById("cloudDot");
  const cloudText = document.getElementById("cloudText");

  if (!CONFIG.apiUrl) {
    cloudDot.className = "cloud-dot";
    cloudText.innerText = "Salvo localmente";
    return;
  }

  cloudDot.className = "cloud-dot syncing";
  cloudText.innerText = "Sincronizando com a planilha...";

  try {
    const payload = { action: "update_or_insert", data: itemData };
    await fetch(CONFIG.apiUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    cloudDot.className = "cloud-dot";
    cloudText.innerText = "Nuvem ativa";
    showToast("Atualizado na planilha");
  } catch (err) {
    cloudDot.className = "cloud-dot offline";
    cloudText.innerText = "Offline (salvo no aparelho)";
  }
}

async function fetchDataFromSheet() {
  if (!CONFIG.apiUrl) {
    alert("URL do script não configurada.");
    return;
  }
  showToast("Buscando dados da planilha...");
  try {
    const res = await fetch(CONFIG.apiUrl);
    const json = await res.json();
    if (json.success && json.rows && json.rows.length > 0) {
      saveStops(json.rows);
      populateCityDropdown();
      renderDayBar();
      renderCards();
      showToast(`${json.rows.length} registros atualizados!`);
    } else {
      showToast("Planilha vazia ou sem novos dados");
    }
  } catch(e) {
    alert("Erro ao sincronizar dados: " + e.message);
  }
}

function updateStopStatus(id, newStatus) {
  const now = new Date();
  const dateStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  if (!STATE[id]) STATE[id] = {};
  STATE[id].status = newStatus;
  STATE[id].date = dateStr;
  STATE[id].responsible = CONFIG.sellerName || "Gabriel Mattos";
  saveState(STATE);

  renderCards();
  syncItemToSheets(getStopData(id));
}

function openQualifyModal(id) {
  currentEditingId = id;
  const data = getStopData(id);
  
  document.getElementById("qualifyTitle").innerText = `Qualificar: ${data.name}`;
  document.getElementById("q_contact").value = data.contact || "";
  document.getElementById("q_phone").value = data.phone || "";
  document.getElementById("q_email").value = data.email || "";
  document.getElementById("q_consumo").value = data.consumo || "";
  document.getElementById("q_padrao").value = data.padrao || "";
  document.getElementById("q_concorrente").value = data.concorrente || "";
  document.getElementById("q_desconto_concorrente").value = data.desconto_concorrente || "";
  document.getElementById("q_fidelidade").value = data.fidelidade || "";
  document.getElementById("q_note").value = data.note || "";

  document.getElementById("modalQualify").style.display = "flex";
}

function saveQualifyData() {
  if (!currentEditingId) return;
  const now = new Date();
  const dateStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  if (!STATE[currentEditingId]) STATE[currentEditingId] = {};
  STATE[currentEditingId].contact = document.getElementById("q_contact").value.trim();
  STATE[currentEditingId].phone = document.getElementById("q_phone").value.trim();
  STATE[currentEditingId].email = document.getElementById("q_email").value.trim();
  STATE[currentEditingId].consumo = document.getElementById("q_consumo").value.trim();
  STATE[currentEditingId].padrao = document.getElementById("q_padrao").value;
  STATE[currentEditingId].concorrente = document.getElementById("q_concorrente").value.trim();
  STATE[currentEditingId].desconto_concorrente = document.getElementById("q_desconto_concorrente").value.trim();
  STATE[currentEditingId].fidelidade = document.getElementById("q_fidelidade").value.trim();
  STATE[currentEditingId].note = document.getElementById("q_note").value.trim();
  STATE[currentEditingId].date = dateStr;

  if (STATE[currentEditingId].concorrente && (!STATE[currentEditingId].status || STATE[currentEditingId].status === "Não visitado")) {
    STATE[currentEditingId].status = "Já com desconto";
  }

  saveState(STATE);
  closeModal("modalQualify");
  renderCards();

  syncItemToSheets(getStopData(currentEditingId));
}

function openAddModal() {
  document.getElementById("add_city").value = currentCity;
  const sel = document.getElementById("add_day");
  const days = getDaysList();
  sel.innerHTML = days.map(d => `<option value="${d}" ${d === currentDay ? 'selected' : ''}>Dia ${d}</option>`).join("") +
                  `<option value="${Math.max(...days) + 1}">+ Novo dia (${Math.max(...days) + 1})</option>`;
                  
  document.getElementById("add_name").value = "";
  document.getElementById("add_segment").value = "";
  document.getElementById("add_address").value = "";
  document.getElementById("add_bairro").value = "";
  document.getElementById("add_phone").value = "";
  document.getElementById("add_note").value = "";
  document.getElementById("modalAdd").style.display = "flex";
}

function fetchCurrentGPS() {
  if (!navigator.geolocation) return alert("Geolocalização não disponível.");
  showToast("Obtendo sinal GPS...");
  navigator.geolocation.getCurrentPosition(pos => {
    window.tempNewLat = pos.coords.latitude;
    window.tempNewLng = pos.coords.longitude;
    document.getElementById("add_address").value = `Coletado via GPS (${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)})`;
    showToast("Localização capturada");
  }, err => alert("Não foi possível obter a localização. Digite o endereço."));
}

function saveNewEstablishment() {
  const name = document.getElementById("add_name").value.trim();
  const segment = document.getElementById("add_segment").value.trim();
  const address = document.getElementById("add_address").value.trim();
  const day = parseInt(document.getElementById("add_day").value, 10);
  const bairro = document.getElementById("add_bairro").value.trim();
  const phone = document.getElementById("add_phone").value.trim();
  const note = document.getElementById("add_note").value.trim();

  if (!name || !address) return alert("Preencha o nome e o endereço.");

  const newId = "manual-" + new Date().getTime();
  const newStop = {
    id: newId,
    day: day,
    cidade: currentCity,
    name: name,
    segment: segment || "Comércio",
    address: address,
    bairro: bairro || "Local",
    phone: phone || "",
    lat: window.tempNewLat || null,
    lng: window.tempNewLng || null
  };

  STOPS.push(newStop);
  saveStops(STOPS);

  if (note) {
    const now = new Date();
    const dateStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    STATE[newId] = { note: note, date: dateStr, status: "Não visitado" };
    saveState(STATE);
  }

  currentDay = day;
  closeModal("modalAdd");
  renderDayBar();
  renderCards();
  showToast("Estabelecimento adicionado");

  syncItemToSheets(getStopData(newId));
}

function openConfigModal() {
  document.getElementById("cfg_apiUrl").value = CONFIG.apiUrl || "";
  document.getElementById("cfg_seller").value = CONFIG.sellerName || "";
  document.getElementById("cfg_importCityName").value = currentCity;
  document.getElementById("modalConfig").style.display = "flex";
}

function saveConfig() {
  CONFIG.apiUrl = document.getElementById("cfg_apiUrl").value.trim();
  CONFIG.sellerName = document.getElementById("cfg_seller").value.trim() || "Gabriel Mattos";
  localStorage.setItem(LS_CONFIG_KEY, JSON.stringify(CONFIG));
  closeModal("modalConfig");
  updateSyncStatusHeader();
  showToast("Ajustes salvos com sucesso");
}

function importTSVForCity() {
  const cityNameInput = document.getElementById("cfg_importCityName").value.trim();
  const raw = document.getElementById("cfg_tsvImport").value.trim();
  if (!raw) return alert("Cole o TSV gerado pelo Gemini antes de importar.");

  const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
  if (lines.length <= 1) return alert("Nenhuma linha encontrada no texto.");

  const startIdx = lines[0].includes("Nome") || lines[0].includes("Dia") ? 1 : 0;
  const newStops = [];
  let detectedCity = cityNameInput;

  for (let i = startIdx; i < lines.length; i++) {
    const cols = lines[i].split("\t");
    let day = parseInt(cols[0], 10);
    let name, phone, email, address, bairro, cidade, segment, status, consumo, padrao, concorrente, descConc, fidelidade, note;

    if (!isNaN(day) && cols.length >= 8) {
      day = day || 1;
      name = cols[1] || "Sem Nome";
      phone = cols[3] || "";
      email = cols[4] || "";
      address = cols[5] || "";
      bairro = cols[6] || "";
      cidade = cols[7] || cityNameInput || currentCity;
      segment = cols[8] || "Comércio";
      status = cols[9] || "Não visitado";
      consumo = cols[10] || "";
      padrao = cols[11] || "";
      concorrente = cols[12] || "";
      descConc = cols[13] || "";
      fidelidade = cols[14] || "";
      note = cols[17] || "";
    } else {
      day = Math.floor((i - startIdx) / 30) + 1;
      name = cols[0] || "Sem Nome";
      address = cols[2] || cols[1] || "";
      phone = cols[3] || "";
      segment = cols[5] || "Comércio";
      bairro = cols[6] || "";
      cidade = cols[7] || cityNameInput || currentCity;
    }

    if (!detectedCity && cidade) detectedCity = cidade;
    const stopId = `imp-${(cidade || 'city').toLowerCase().replace(/\s+/g,'-')}-${i}-${new Date().getTime()}`;

    newStops.push({
      id: stopId,
      day: day,
      cidade: cidade,
      name: name,
      address: address,
      phone: phone,
      segment: segment,
      bairro: bairro
    });

    if (note || consumo || padrao || concorrente) {
      STATE[stopId] = {
        status: status || "Não visitado",
        consumo: consumo || "",
        padrao: padrao || "",
        concorrente: concorrente || "",
        desconto_concorrente: descConc || "",
        fidelidade: fidelidade || "",
        note: note || "",
        date: "",
        responsible: CONFIG.sellerName || "Gabriel Mattos"
      };
    }
  }

  const finalCity = detectedCity || cityNameInput || "Nova Cidade";
  STOPS = STOPS.filter(s => (s.cidade || "").toLowerCase() !== finalCity.toLowerCase());
  STOPS.push(...newStops);
  saveStops(STOPS);
  saveState(STATE);

  currentCity = finalCity;
  localStorage.setItem(LS_SELECTED_CITY, currentCity);
  closeModal("modalConfig");
  initApp();
  showToast(`${newStops.length} pontos carregados para ${finalCity}`);
}

function updateSyncStatusHeader() {
  const cloudText = document.getElementById("cloudText");
  const cloudDot = document.getElementById("cloudDot");
  if (CONFIG.apiUrl) {
    cloudDot.className = "cloud-dot";
    cloudText.innerText = `Nuvem ativa (${CONFIG.sellerName || 'Gabriel Mattos'})`;
  } else {
    cloudDot.className = "cloud-dot";
    cloudText.innerText = "Modo local";
  }
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 2500);
}

function renderMap() {
  const dayStops = getCityStops().filter(s => (s.day || 1) === currentDay && s.lat && s.lng);
  if (!map) {
    map = L.map('map-view').setView([-19.620, -44.040], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    mapLayer = L.layerGroup().addTo(map);
  }

  mapLayer.clearLayers();
  if (dayStops.length === 0) return;

  const latlngs = [];
  dayStops.forEach((stop, idx) => {
    const data = getStopData(stop.id);
    const color = STATUS_COLORS[data.status] || "#636363";
    latlngs.push([stop.lat, stop.lng]);

    const marker = L.circleMarker([stop.lat, stop.lng], {
      radius: 8, fillColor: color, color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.95
    });
    marker.bindPopup(`
      <b style="color:var(--b2u-orange);">${idx + 1}. ${stop.name}</b><br>
      ${stop.address}<br>
      <b>Status:</b> ${data.status}
    `);
    mapLayer.addLayer(marker);
  });

  if (latlngs.length > 1) {
    mapLayer.addLayer(L.polyline(latlngs, { color: '#ff5e0f', weight: 2.5, dashArray: '5, 8' }));
    map.fitBounds(L.latLngBounds(latlngs), { padding: [30, 30] });
  } else if (latlngs.length === 1) {
    map.setView(latlngs[0], 15);
  }
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
